name: salin
description: "A premium, local-first budgeting application built for students and young Filipino professionals"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2
  
dependencies:
  drift: ^2.34.2
  file_picker: ^8.3.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.1.0
  go_router: ^16.0.0
  http: ^1.2.2
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logger: ^2.7.0
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: ^0.6.0+eol
  supabase_flutter: ^2.16.0
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.5
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/salin-logo.png
    - assets/salin.env
    - assets/images/receipt.png

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/salin-logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  min_sdk_android: 21
